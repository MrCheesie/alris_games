<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Doc editor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f4f5f7;
      color: #1f2937;
    }

    body {
      overflow: hidden;
    }

    /* Header */

    .header {
      height: 64px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 8px;
      background: #2563eb;
      color: white;

      font-weight: 700;
      font-size: 17px;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 700;
    }

    .file-name {
      margin-left: 14px;
      color: #6b7280;
      font-size: 13px;

      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      font-family: inherit;
    }

    .button {
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #374151;

      border-radius: 7px;
      padding: 8px 13px;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;
    }

    .button:hover {
      background: #f9fafb;
    }

    .button.primary {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
    }

    .button.primary:hover {
      background: #1d4ed8;
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* App */

    .app {
      height: calc(100vh - 64px);
      display: flex;
      flex-direction: column;
    }

    /* Toolbar */

    #toolbar {
      min-height: 50px;
      background: white;
      border-bottom: 1px solid #e5e7eb;

      display: flex;
      align-items: center;

      padding: 5px 12px;
      overflow-x: auto;
    }

    /* Editor */

    .editor-container {
      flex: 1;
      min-height: 0;
      overflow: auto;

      padding: 24px;
      background: #eef0f3;
    }

    #editor {
      width: 100%;
      min-height: 100%;
    }

    /* Upload screen */

    .upload-screen {
      position: fixed;
      inset: 64px 0 0 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f4f5f7;
      z-index: 10;
    }

    .upload-card {
      width: min(520px, calc(100% - 32px));

      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;

      padding: 42px;

      text-align: center;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.06);
    }

    .upload-icon {
      width: 58px;
      height: 58px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;
      background: #eff6ff;
      color: #2563eb;

      font-size: 28px;
    }

    .upload-card h1 {
      margin: 0 0 8px;

      font-size: 22px;
      color: #111827;
    }

    .upload-card p {
      margin: 0 auto 24px;

      max-width: 390px;

      color: #6b7280;
      font-size: 14px;
      line-height: 1.6;
    }

    .drop-zone {
      border: 2px dashed #d1d5db;
      border-radius: 10px;

      padding: 28px 20px;

      transition:
        border-color 0.15s,
        background 0.15s;
    }

    .drop-zone.dragover {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .drop-zone span {
      display: block;

      margin-top: 10px;

      color: #9ca3af;
      font-size: 12px;
    }

    .privacy-note {
      margin-top: 22px;

      color: #9ca3af;
      font-size: 12px;
    }

    /* Hidden until document loaded */

    .hidden {
      display: none !important;
    }

    /* Mobile */

    @media (max-width: 700px) {
      .header {
        padding: 0 12px;
      }

      .file-name {
        display: none;
      }

      .editor-container {
        padding: 8px;
      }

      .upload-card {
        padding: 30px 20px;
      }

      .actions .button.secondary {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->

  <header class="header">
    <div class="brand">
      <div class="brand-icon">S</div>

      <div class="brand-name">
        SimpleDoc
      </div>

      <div id="file-name" class="file-name">
        No document
      </div>
    </div>

    <div class="actions">

      <button
        id="new-document"
        class="button secondary"
      >
        Open DOCX
      </button>

      <button
        id="download-document"
        class="button primary"
        disabled
      >
        Download DOCX
      </button>

    </div>
  </header>


  <!-- Main application -->

  <main class="app">

    <!-- SuperDoc toolbar -->

    <div id="toolbar"></div>

    <!-- SuperDoc editor -->

    <div class="editor-container">
      <div id="editor"></div>
    </div>

  </main>


  <!-- Upload screen -->

  <section id="upload-screen" class="upload-screen">

    <div class="upload-card">

      <div class="upload-icon">
        📄
      </div>

      <h1>
        Edit a Word document
      </h1>

      <p>
        Upload a DOCX file and edit it directly in your browser.
        Your document is not uploaded to a server.
      </p>

      <div
        id="drop-zone"
        class="drop-zone"
      >

        <button
          id="choose-file"
          class="button primary"
        >
          Choose DOCX file
        </button>

        <span>
          or drag and drop a .docx file here
        </span>

      </div>

      <div class="privacy-note">
        🔒 Your file stays in your browser.
      </div>

    </div>

  </section>


  <!-- Hidden file input -->

  <input
    id="file-input"
    type="file"
    accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    hidden
  />


  <!-- Vite entry -->

  <script type="module" src="/src/main.js"></script>

</body>
</html>
