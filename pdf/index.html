<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>PDF Editor</title>
</head>
<body>
    <div id="pdf-viewer" style="height: 90vh"></div>

    <script type="module">
      import EmbedPDF from 'https://cdn.jsdelivr.net/npm/@embedpdf/snippet@2/dist/embedpdf.js';

      EmbedPDF.init({
        type: 'container',
        target: document.getElementById('pdf-viewer'),
        src: 'https://snippet.embedpdf.com/ebook.pdf',
        theme: { preference: 'system' }
      });
    </script>

    <footer class="footer">
      <p id="copyRight" style="font-family: 'JetBrains Mono';">&copy; 2026 Alris Dhanwani. All rights reserved.</p>
      <p class="copyRight" style="font-family: 'JetBrains Mono';">Thanks to <a href="https://www.embedpdf.com" id="buh">embedpdf</a> for making this possible.</p>
      <a href="../index.html" class="buh">Return to homepage</a>
    </footer>
</body>
</html>
