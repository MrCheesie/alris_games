<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Font embed -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <title>Text Repeater</title>
</head>
<body>
    <div id="container">
        <div>
            <form id="formy">
                <label for="quantity">Select Quantity:</label>
                <input type="number" id="quantity" name="quantity" min="1" value="1">
                <br><br>
                <input type="text" name="textInput" id="textInput" value="Enter text to repeat here ">
                <br><br>
                <button type="submit">Repeat</button>
            </form>
        </div>
        <div>
            <button type="button" id="copyBtn">Copy</button>
            <p id="result">Repeated text will appear here</p>
        </div>
    </div>

    <script src="app.js" defer></script>

    <footer class="footer">
      <p>&copy; 2026 Alris Dhanwani. All rights reserved.</p>
      <a href="../index.html" id="buh">Return to homepage</a>
    </footer>
</body>
</html>
